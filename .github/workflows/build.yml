name: Build Magisk Module

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: 打包面具模块
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取模块信息 (module.prop)
        id: module
        run: |
          prop="module/module.prop"
          id=$(sed -n 's/^id=//p' "$prop" | head -1)
          version=$(sed -n 's/^version=//p' "$prop" | head -1)
          versionCode=$(sed -n 's/^versionCode=//p' "$prop" | head -1)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "versionCode=$versionCode" >> "$GITHUB_OUTPUT"
          echo "tag=swab_protect" >> "$GITHUB_OUTPUT"
          echo "module id: $id"
          echo "module version: $version"
          echo "module versionCode: $versionCode"

      - name: 打包为 Magisk 模块 zip
        run: |
          mkdir -p release
          cd module
          # zip 根目录直接包含 module.prop / service.sh 等，符合 Magisk 模块规范
          zip -r9 "../release/${{ steps.module.outputs.id }}-${{ steps.module.outputs.version }}.zip" . \
            -x '*.git*' '*/.DS_Store'
          cd ..
          echo "=== 生成的文件 ==="
          ls -lh release/

      - name: 校验 zip 内容
        run: |
          unzip -l "release/${{ steps.module.outputs.id }}-${{ steps.module.outputs.version }}.zip"

      - name: 上传 Artifact（提供下载）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.module.outputs.id }}-${{ steps.module.outputs.version }}-${{ github.sha }}
          path: release/*.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          tag_name: ${{ github.ref_name }}
          name: Swab ${{ steps.module.outputs.version }}
          body: |
            自动构建：`${{ steps.module.outputs.id }}` v${{ steps.module.outputs.version }} (versionCode ${{ steps.module.outputs.versionCode }})

            - 提交：${{ github.sha }}
            - 直接下载 zip 后在 KernelSU / Magisk 中刷入即可。
          draft: false
          prerelease: false
